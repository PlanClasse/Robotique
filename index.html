<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robotique — gestion de classe</title>
<meta name="theme-color" content="#0E7490">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A4%96%3C/text%3E%3C/svg%3E">
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&family=Bangers&display=swap');
@font-face{font-family:'Bungee Shade';src:url('fonts/bungee-shade.woff2') format('woff2');font-display:swap}
@font-face{font-family:'Bungee';src:url('fonts/bungee.woff2') format('woff2');font-display:swap}
:root{--bg:#F5F3EE;--sur:#FFF;--brd:#D2CEC2;--tx:#19170E;--mut:#6B675C;--acc:#0E7490;--acc-l:#DDF1F6;--red:#B91C1C;--red-l:#FBE2E0;--sh:0 2px 8px rgba(0,0,0,.07);--r:10px}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.4 'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--brd);background:var(--sur);border-radius:8px;padding:6px 11px}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.danger{background:var(--red);border-color:var(--red);color:#fff}
button.ghost{background:transparent;border-style:dashed;color:var(--mut);width:100%}
button.x{border:none;background:transparent;padding:2px 6px;font-size:18px;line-height:1;color:var(--mut)}
button.x.del{background:var(--red-l);color:var(--red);border-radius:6px;font-size:15px}
input[type=text],input[type=date],input[type=number],input:not([type]),select,textarea{border:1px solid var(--brd);border-radius:8px;padding:6px 8px;background:var(--sur)}
textarea{resize:vertical;width:100%}
h1,h2,h3{font-family:'DM Serif Display',serif;font-weight:400;margin:0}
.muted{color:var(--mut)}
a{color:inherit}
/* En-tête */
header{display:flex;align-items:center;gap:14px;padding:8px 14px;background:var(--sur);border-bottom:1px solid var(--brd);flex-wrap:wrap}
header h1{font-size:22px;color:var(--acc);white-space:nowrap}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav button{border:none;background:transparent;border-radius:8px;padding:7px 11px;color:var(--mut)}
nav button.on{background:var(--acc-l);color:var(--acc);font-weight:600}
header .sp{flex:1}
.ver{font-size:11px;color:var(--mut)}
main{flex:1;overflow:auto;padding:12px 14px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.bar .sp{flex:1}
.card{background:var(--sur);border:1px solid var(--brd);border-radius:var(--r);box-shadow:var(--sh);padding:12px}
.empty{max-width:520px;margin:60px auto;text-align:center}
.empty p{color:var(--mut)}
/* Tableau kanban */
.board{display:flex;gap:10px;align-items:flex-start;overflow-x:auto;padding-bottom:12px;min-height:60vh}
.col{flex:0 0 240px;background:#EDEAE2;border:1px solid var(--brd);border-radius:var(--r);padding:8px;display:flex;flex-direction:column;gap:6px;min-height:200px}
.col.pal{flex-basis:220px;background:var(--sur);position:sticky;left:0;z-index:2;max-height:78vh;overflow:auto}
.col.res{background:#E8E4DA}
.col.hot,.abs.hot{outline:3px solid var(--acc);outline-offset:-1px;background:var(--acc-l)}
.colh{display:flex;align-items:center;gap:6px}
.colh b{font-size:15px}
.colh .cnt{font-size:12px;background:var(--sur);border-radius:10px;padding:0 7px;color:var(--mut)}
.eqname{flex:1;min-width:0;font-weight:600;border:1px solid transparent!important;background:transparent!important;padding:3px 4px!important}
.eqname:focus{border-color:var(--brd)!important;background:var(--sur)!important}
.warn{font-size:12px;background:#FEF3C7;color:#92400E;border-radius:10px;padding:1px 7px;cursor:help;white-space:nowrap}
.sub{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin-top:4px}
.zone{display:flex;flex-wrap:wrap;gap:5px;min-height:34px}
.hint{font-size:12px;color:var(--mut);padding:8px;border:1px dashed var(--brd);border-radius:8px;width:100%;text-align:center}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--sur);border:1px solid var(--brd);border-radius:20px;padding:3px 9px 3px 3px;cursor:grab;touch-action:none;user-select:none;font-size:13px}
.orig{font-size:10px;color:var(--mut);background:var(--bg);border-radius:6px;padding:0 4px}
.av{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-size:10px;font-weight:600;color:#fff;flex:none}
.task{background:var(--sur);border:1px solid var(--brd);border-left:4px solid var(--mut);border-radius:8px;padding:6px 8px;cursor:grab;touch-action:none;user-select:none;display:flex;gap:6px;align-items:flex-start}
.task .tt{flex:1;font-size:13px}
.task .meta{font-size:11px;color:var(--mut)}
.stbtn{border:none;padding:1px 7px;border-radius:10px;font-size:11px;white-space:nowrap;color:#fff}
.mats{display:flex;flex-wrap:wrap;gap:4px}
.mat{font-size:12px;background:var(--acc-l);color:var(--acc);border-radius:6px;padding:2px 4px 2px 7px;display:inline-flex;align-items:center;gap:2px;cursor:grab;touch-action:none;user-select:none}
.mat button{border:none;background:transparent;padding:0 3px;color:var(--red)}
.obs{font-size:12px;min-height:34px}
.abs{margin-top:auto;border-top:1px dashed var(--brd);padding-top:6px;border-radius:8px;min-height:50px}
.abs .chip{opacity:.6}
.lib{background:var(--bg);border:1px solid var(--brd);border-radius:8px;padding:6px 8px;cursor:grab;touch-action:none;user-select:none;font-size:13px}
.lib small{display:block;color:var(--mut);font-size:11px}
.tabs{display:flex;gap:3px;flex-wrap:wrap}
.tabs button{padding:3px 8px;font-size:12px;border-radius:14px}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.dragging{opacity:.35}
.ghostdrag{position:fixed;pointer-events:none;z-index:1000;transform:rotate(-2deg);box-shadow:0 8px 20px rgba(0,0,0,.2);opacity:.95}
.addcol{flex:0 0 120px;min-height:80px;border:2px dashed var(--brd);background:transparent;color:var(--mut);border-radius:var(--r)}
.sinfo{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.sinfo input.t{flex:1;min-width:180px}
/* Tables */
table{border-collapse:collapse}
.mx{font-size:12px}
.mx th,.mx td{border:1px solid var(--brd);padding:0;text-align:center;min-width:28px;height:28px}
.mx th.v{writing-mode:vertical-rl;transform:rotate(180deg);padding:4px 2px;font-weight:500;height:auto;white-space:nowrap}
.mx th.r{text-align:right;padding:0 8px;white-space:nowrap;font-weight:500;position:sticky;left:0;background:var(--sur)}
.mx td.c{cursor:pointer}
.mx td.self{background:#E5E1D6}
.wrap{overflow:auto;max-width:100%}
.prog th,.prog td{border:1px solid var(--brd);padding:4px 6px;font-size:12px}
.prog th.r{position:sticky;left:0;background:var(--sur);text-align:left;white-space:nowrap}
.prog thead th{background:var(--sur);vertical-align:bottom;max-width:120px}
.pc{width:100%;border:none;border-radius:6px;padding:4px;font-size:12px;min-width:72px}
.pc.man{box-shadow:inset 0 0 0 2px #19170E55}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.it h3{font-size:18px;margin-bottom:4px}
.it p{margin:4px 0;color:var(--mut);font-size:13px;white-space:pre-wrap}
.tag{display:inline-block;font-size:11px;background:var(--acc-l);color:var(--acc);border-radius:6px;padding:1px 6px;margin:2px 3px 0 0}
.tl{display:flex;flex-direction:column;gap:8px}
.tl .card h3{font-size:17px}
.tl .eqline{font-size:13px;margin:3px 0}
.sec{margin-bottom:16px}
.sec h2{font-size:20px;margin-bottom:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:5px 0}
/* Modales */
.ov{position:fixed;inset:0;background:rgba(25,23,14,.35);display:grid;place-items:center;z-index:500;padding:12px}
.modal{background:var(--sur);border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.25);width:min(620px,100%);max-height:92vh;display:flex;flex-direction:column}
.mh{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--brd)}
.mh h3{flex:1;font-size:20px}
.mb{padding:14px;overflow:auto}
.mf{display:flex;gap:8px;justify-content:flex-end;padding:10px 14px;border-top:1px solid var(--brd);flex-wrap:wrap}
.mf .l{margin-right:auto}
.fld{display:flex;flex-direction:column;gap:3px;margin-bottom:10px}
.fld>span{font-size:12px;color:var(--mut);font-weight:500}
.multi{display:flex;flex-wrap:wrap;gap:4px}
.pick{font-size:12px;padding:3px 8px;border-radius:14px}
.pick.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.stars .star{border:none;background:none;font-size:22px;color:#D2CEC2;padding:0 2px}
.stars .star.on{color:#D97706}
.st{display:flex;gap:4px;flex-wrap:wrap}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--tx);color:#fff;padding:8px 16px;border-radius:20px;z-index:2000;font-size:13px}
.kv{font-size:13px}
.kv td{padding:2px 8px 2px 0;vertical-align:top}
.col.mini{flex:0 0 46px;padding:8px 4px;align-items:center;cursor:pointer;gap:10px}
.vt{writing-mode:vertical-rl;transform:rotate(180deg);font-weight:600;color:var(--mut);white-space:nowrap}
.abs.mini{border:none;margin:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;width:100%}
.task.alert{background:#F5F3FF;animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px #7C3AED44}}
.hb{font-size:11px;color:#92400E;white-space:nowrap}
.projo .col{flex:1 0 260px;min-width:0}
.projo .task{cursor:pointer;font-size:15px}
.projo .task .tt{font-size:15px}
.ph{display:flex;align-items:center;gap:14px;flex-wrap:wrap;width:100%}
.ph .join{font-size:15px;background:var(--acc-l);color:var(--acc);border-radius:10px;padding:6px 12px}
.ph .join b{font-size:20px;letter-spacing:.12em}
.aide{background:#FEF3C7;color:#78350F;border-radius:8px;padding:8px 10px;margin:6px 0;white-space:pre-wrap}
.consigne{font-size:16px;white-space:pre-wrap;background:var(--bg);padding:10px 12px;border-radius:8px;margin:0 0 8px}
.bravo{background:#EDE9FE;color:#5B21B6;padding:12px;border-radius:10px;font-weight:600;margin-top:10px;font-size:15px}
.bravo.ok{background:#DCFCE7;color:#166534}
button.big{font-size:17px;padding:10px 18px}
.codebig{font:600 42px/1 'DM Sans',sans-serif;letter-spacing:.15em;color:var(--acc);text-align:center;margin:12px 0}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#DC2626;margin-right:5px}
.dot.ok{background:#16A34A}
.livebadge{font-size:12px;border:1px solid var(--brd);border-radius:14px;padding:3px 9px;background:var(--sur);white-space:nowrap}
.path{max-width:680px;margin:0 auto}
.step{display:flex;gap:12px}
.step .num{flex:none;width:46px;display:flex;flex-direction:column;align-items:center}
.step .num span{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:17px;background:var(--sur);border:3px solid var(--brd)}
.step .num::after{content:'';flex:1;width:3px;background:var(--brd);margin:3px 0}
.step:last-child .num::after{display:none}
.step .body{flex:1;background:var(--sur);border:1px solid var(--brd);border-radius:12px;padding:12px 14px;margin-bottom:14px;cursor:pointer;box-shadow:var(--sh);font-size:16px}
.step .body:hover{border-color:var(--acc)}
.step.cur .body{border:2px solid var(--acc)}
.step.cur .num span{border-color:var(--acc);color:var(--acc)}
.step.reussi .num span{background:#16A34A;color:#fff;border-color:#16A34A}
.step.avalider .num span{background:#7C3AED;color:#fff;border-color:#7C3AED}
.step.reussi .body{opacity:.75}
.stl{font-size:12px;font-weight:600;margin-top:4px}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;max-width:800px;margin:0 auto}
.teams button{font-size:20px;padding:22px 10px;font-family:'DM Serif Display',serif}
.tg{display:flex;gap:10px;align-items:flex-start}
.gridmode .tg{flex:1;display:grid;gap:8px;min-width:0}
.gridmode .tg .col{height:calc((100vh - 215px)/2);min-height:250px;overflow:hidden}
.gridmode .col.pal{max-height:calc(100vh - 200px)}
.tl{display:flex;flex-direction:column;gap:6px;position:relative}
.gridmode .tl,.projo .tl{flex:1;overflow-y:auto;min-height:40px;padding:2px}
.projo{display:grid;gap:10px}
.gridmode .tg.r1 .col{height:calc(100vh - 215px)}
.projo.r1 .col{height:calc(100vh - 110px)}
.projo .col{height:calc((100vh - 110px)/2);min-height:220px;overflow:hidden}
.photos{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.phot{position:relative}
.bloc{display:block;max-width:100%;height:auto}
.blocsrow{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:8px 10px;border:2px solid #22C55E;border-radius:10px;margin:6px 0;background:#fff}
.blocsfld{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.blocsfld .phot img{width:auto;height:auto;object-fit:contain;border:none;cursor:default}
.memohd{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;position:sticky;top:-14px;background:var(--sur);padding:6px 0;z-index:2}
.memohd input{flex:1;min-width:160px}
.mcat h3{display:flex;align-items:center;gap:8px;margin:14px 0 6px;font-size:15px}
.mcat h3 img{height:30px}
.mgrid{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
button.bk{background:none;border:2px solid transparent;padding:3px;border-radius:8px;cursor:pointer;box-shadow:none}
button.bk:hover{border-color:var(--brd)}
button.bk.on{border-color:#22C55E;background:#DCFCE7}
.modal.wide{width:min(980px,100%)}
.tcodes{display:flex;flex-wrap:wrap;gap:6px}
.bdrow{display:flex;gap:8px;align-items:center;margin:4px 0}
.bdrow img{flex:none;max-width:300px}
.bdrow input{flex:1;min-width:0}
.tcode{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--brd);border-left:5px solid;border-radius:8px;padding:4px 10px}
.tcode b{font-family:Bungee,'Arial Black',sans-serif;letter-spacing:.1em}
table.cnp td,table.cnp th{text-align:center;padding:4px 6px;font-size:13px}
table.cnp td.f{background:#DCFCE7;font-weight:700}
.vopts{display:flex;flex-direction:column;gap:10px}
.vopt{display:flex;gap:12px;align-items:center;text-align:left;padding:10px 12px}
.vopt .ic{font-size:26px}
.lfilter{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 10px}
.lfilter input{flex:1;min-width:180px}
.pal .lfilter{margin:4px 0}
.pal .lfilter input{min-width:0;width:100%}
.pal .lfilter select{width:100%}
.lcount{font-size:12px}
.phot img,.thumbs img{width:84px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--brd);cursor:zoom-in;display:block}
.phot button{position:absolute;top:2px;right:2px;padding:0 5px}
.addph{border:1px dashed var(--brd);border-radius:8px;padding:18px 10px;cursor:pointer;color:var(--mut);font-size:13px}
.thumbs{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0}
.lib img{width:100%;height:60px;object-fit:cover;border-radius:5px;margin-top:4px}
.splash{max-width:860px;margin:6vh auto;text-align:center}
.splash h2{font-size:34px;margin-bottom:6px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:28px 0 16px}
.choices button{padding:34px 18px;border-radius:18px;border:2px solid var(--brd);background:var(--sur);box-shadow:var(--sh)}
.choices button:hover{border-color:var(--acc);transform:translateY(-2px)}
.choices .ic{font-size:64px;display:block}
.choices b{font:400 30px 'DM Serif Display',serif;display:block;margin:8px 0}
.choices span.d{color:var(--mut);font-size:14px}
.dbx{font-size:12px;border:1px solid var(--brd);border-radius:14px;padding:3px 9px;background:var(--sur);cursor:pointer;white-space:nowrap}
@media (max-width:700px){.choices{grid-template-columns:1fr}}
.seq{display:flex;flex-direction:column;gap:4px}
.seqrow{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--brd);border-radius:8px;padding:4px 6px;font-size:13px}
.seqrow .sn{width:22px;height:22px;border-radius:50%;background:var(--acc);color:#fff;display:inline-grid;place-items:center;font-size:11px;font-weight:600;flex:none}
.gbadge{font-size:11px;font-weight:700;color:#fff;border-radius:10px;padding:1px 8px;white-space:nowrap}
.grp{margin-bottom:10px}
.gdot{width:14px;height:14px;border-radius:50%;flex:none}
.tpick{display:inline-flex;align-items:center;gap:4px;font-size:13px;padding:4px 10px;border-radius:14px;border:1px solid var(--brd);cursor:pointer;background:var(--sur);user-select:none}
.tpick.on{color:#fff;border-color:transparent}
.tpick.other{opacity:.45}
.cn-wrap{max-width:980px;margin:0 auto}
.cn-big{font-family:'Bungee Shade',Bungee,'Arial Black',sans-serif;font-size:46px;line-height:1}
.cn-t{font-family:Bungee,'Arial Black',sans-serif;letter-spacing:.02em}
.cn-mondes{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.cn-monde{text-align:left;border:3px solid var(--mc);border-radius:18px;background:var(--sur);padding:14px;display:flex;flex-direction:column;gap:6px;box-shadow:0 5px 0 var(--mc)}
.cn-monde:hover{transform:translateY(-2px)}
.cn-monde.lock{opacity:.55;box-shadow:0 5px 0 #CBD5E1;border-color:#CBD5E1}
.cn-monde.lock:hover{transform:none}
.cn-reprise{font-family:Bungee,'Arial Black',sans-serif;font-size:22px;letter-spacing:.08em;background:#F1F5F9;border:2px dashed #94A3B8;border-radius:10px;padding:8px 14px;display:inline-block;user-select:all}
.cn-monde .n{font-family:Bungee,'Arial Black',sans-serif;color:var(--mc);font-size:13px}
.cn-monde b{font-size:18px}
.cn-bar{height:10px;border-radius:5px;background:#E5E7EB;overflow:hidden}.cn-bar i{display:block;height:100%;background:var(--mc)}
.cn-defi{display:flex;gap:12px;align-items:center;border:2px solid var(--brd);border-radius:14px;padding:10px 14px;background:var(--sur);text-align:left;width:100%;font-size:16px}
.cn-defi .num{font-family:Bungee,'Arial Black',sans-serif;width:110px;color:var(--mc)}
.cn-defi.lock{opacity:.5;cursor:not-allowed}
.cn-defi.done{border-color:#16A34A}
.cn-defi.cur{border:3px solid var(--mc);box-shadow:0 4px 0 var(--mc)}
.cn-stars{color:#F59E0B;letter-spacing:1px}
.cn-card{background:var(--sur);border:3px solid var(--mc);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:14px}
.cn-card.ultime{background:#FEF9C3;border-color:#EF4444}
.cn-consigne{font-size:21px;font-weight:800;line-height:1.35}
.cn-box{border:3px solid #22C55E;border-radius:14px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cn-box .lab{font-family:Bungee,'Arial Black',sans-serif;color:#16A34A;margin-right:4px}
.cn-blk{color:#fff;font-weight:800;font-size:14px;padding:6px 12px;border-radius:8px;border-bottom:4px solid rgba(0,0,0,.2)}
.cn-img{max-width:100%;height:auto;display:block}
.cn-cat{display:inline-flex;align-items:center;gap:6px;font-weight:800}
.cn-cat i{width:14px;height:14px;border-radius:50%;display:inline-block}
.cn-cat img{height:36px}
.cn-warn{display:flex;gap:8px;align-items:center;font-weight:900;flex-wrap:wrap}
.cn-warn .a{background:#DC2626;color:#fff;font-family:Bungee,'Arial Black',sans-serif;font-size:13px;padding:4px 10px;border-radius:6px}
.cn-warn .t{background:#FEF08A;color:#DC2626;padding:4px 12px;border-radius:10px}
.cn-table{background:#FED7AA;color:#6D28D9;font-weight:900;padding:8px 14px;border-radius:12px}

<script>
'use strict';
const APP_VERSION = 'v1.14.0';
const KEY = 'robotique-data-v1', UIKEY = 'robotique-ui-v1';

/* ─────────────── Utilitaires ─────────────── */
const setKids = (el, ...k) => el.replaceChildren(...k.flat(Infinity).filter(x => x!=null && x!==false));
function h(tag, props, ...kids){
  const el = document.createElement(tag); let val;
  if (props) for (const [k,v] of Object.entries(props)){
    if (v==null || v===false) continue;
    if (k==='class') el.className = v;
    else if (k==='style' && typeof v==='object'){ for (const [sk,sv] of Object.entries(v)) if (sk.startsWith('--')) el.style.setProperty(sk, sv); else el.style[sk] = sv; }
    else if (k==='dataset') Object.assign(el.dataset, v);
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k==='value') val = v;
    else if (k==='checked' || k==='textContent' || k==='disabled') el[k] = v;
    else el.setAttribute(k, v===true ? '' : v);
  }
  for (const c of kids.flat(Infinity)){ if (c==null || c===false) continue; el.append(c instanceof Node ? c : String(c)); }
  if (val!==undefined) el.value = val;
  return el;
}
const uid = () => Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4);
const byId = (arr,id) => arr.find(x => x.id===id);
const today = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const fmtDate = s => s ? new Date(s+'T12:00').toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short',year:'2-digit'}) : '';
const hue = s => { let x=7; for (const c of String(s)) x=(x*31+c.charCodeAt(0))%360; return x; };
const cmpDate = (a,b) => (a.date||'').localeCompare(b.date||'');
const norm = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
function toast(msg){ const t=h('div',{class:'toast'},msg); document.body.append(t); setTimeout(()=>t.remove(),2200); }
function download(name, text){ const a=h('a',{href:URL.createObjectURL(new Blob([text],{type:'application/json'})),download:name}); document.body.append(a); a.click(); a.remove(); }

/* ─────────────── Données ─────────────── */
const TYPES = {
  defis:        {label:'Défis', one:'défi', icon:'🏆', task:true},
  exercices:    {label:'Exercices', one:'exercice', icon:'📝', task:true},
  parcours:     {label:'Séries', one:'série', icon:'🧭'},
  etapes:       {label:'Progression', one:'étape', icon:'📈'},
  connaissances:{label:'Connaissances', one:'connaissance', icon:'💡'},
  materiels:    {label:'Matériels', one:'matériel', icon:'🤖'},
  tapis:        {label:'Tapis', one:'tapis', icon:'🗺️'},
};
const TASK_FIELDS = [['titre','Titre'],['niveau','Difficulté','stars'],['etapeId','Étape de progression','etape'],['description','Consigne','textarea'],['aides','Coups de pouce (un par ligne, dévoilés un à un aux élèves)','textarea'],['blocs','Blocs à utiliser (montrés aux élèves, dans le désordre)','blocs'],
  ['materiels','Matériel','multi','materiels'],['tapis','Tapis','multi','tapis'],['connaissances','Connaissances mobilisées','multi','connaissances']];
TYPES.defis.fields = TASK_FIELDS; TYPES.exercices.fields = TASK_FIELDS;
TYPES.parcours.fields = [['titre','Titre'],['description','Objectif','textarea'],['items','Exercices et défis, dans l\'ordre','seq']];
TYPES.etapes.fields = [['titre','Titre'],['description','Objectif','textarea'],['connaissances','Connaissances visées','multi','connaissances']];
TYPES.connaissances.fields = [['titre','Intitulé'],['domaine','Domaine / thème'],['description','Description','textarea']];
TYPES.materiels.fields = [['titre','Nom'],['quantite','Quantité disponible','number'],['description','Remarques','textarea'],['photos','Photos','photos']];
TYPES.tapis.fields = [['titre','Nom'],['dimensions','Dimensions'],['description','Description','textarea'],['photos','Photos (prises au téléphone ou fichiers)','photos']];

const ST = {
  afaire:   {l:'À faire', c:'#78716C'},
  encours:  {l:'En cours', c:'#D97706'},
  avalider: {l:'À valider', c:'#7C3AED'},
  reussi:   {l:'Réussi', c:'#16A34A'},
  reprendre:{l:'À reprendre', c:'#DC2626'},
};
const ST_ORDER = ['afaire','encours','avalider','reussi','reprendre'];
const STU = {afaire:'À faire', encours:'En cours', avalider:'À montrer à vos coachs', reussi:'Validé ✓', reprendre:'À reprendre'};
const PST = { non:{l:'Non commencé',c:'#F1EFE9',t:'#6B675C'}, encours:{l:'En cours',c:'#FDE68A',t:'#78350F'}, acquis:{l:'Acquis',c:'#86EFAC',t:'#14532D'} };

function emptyData(){ return {v:1, carnet:{}, classes:[], eleves:[], lib:{defis:[],exercices:[],parcours:[],etapes:[],connaissances:[],materiels:[],tapis:[]}, seances:[], prog:{}}; }
function normalize(d){
  const e = emptyData(); d = Object.assign(e, d||{});
  d.lib = Object.assign(emptyData().lib, d.lib||{});
  for (const s of d.seances){ s.equipes = s.equipes||[]; s.reserve = s.reserve||[]; s.absents = s.absents||[]; s.groupes = s.groupes||[];
    for (const q of s.equipes){ q.eleves=q.eleves||[]; q.taches=q.taches||[]; q.materiels=q.materiels||[]; q.tapis=q.tapis||[]; } }
  d.prog = d.prog||{}; d.carnet = d.carnet||{};
  return d;
}
let D = emptyData();
try { const raw = localStorage.getItem(KEY); if (raw) D = normalize(JSON.parse(raw)); } catch(e){ console.warn(e); }
let U = {view:'seance', classeId:null, seanceId:null, libType:'defis', palTab:'defis', teamSize:2};
try { Object.assign(U, JSON.parse(localStorage.getItem(UIKEY)||'{}')); } catch(e){}
const saveUI = () => { try{ localStorage.setItem(UIKEY, JSON.stringify(U)); }catch(e){} };

const undoStack = [];
function save(){ D._mod = Date.now(); dbxSchedule(); try { localStorage.setItem(KEY, JSON.stringify(D)); } catch(e){ toast('⚠ Enregistrement impossible : '+e.message); } liveTick(); }
function commit(fn, silent){
  undoStack.push(JSON.stringify(D)); if (undoStack.length>50) undoStack.shift();
  fn(); save(); if (!silent) render(); else renderHeader();
}
function undo(){ if (!undoStack.length) return toast('Rien à annuler'); D = normalize(JSON.parse(undoStack.pop())); save(); render(); toast('Action annulée'); }

/* Accès */
const curClasse = () => { let c = byId(D.classes, U.classeId); if (!c && D.classes.length){ c = D.classes[0]; U.classeId = c.id; } return c; };
const elevesOf = cid => D.eleves.filter(e => e.classeId===cid).sort((a,b)=>(a.prenom+a.nom).localeCompare(b.prenom+b.nom,'fr'));
const eleve = id => byId(D.eleves, id);
const seancesOf = cid => D.seances.filter(s => s.classeId===cid).sort(cmpDate);
const short = e => e ? e.prenom + (e.nom ? ' '+e.nom[0]+'.' : '') : '?';
const full = e => e ? (e.prenom+' '+e.nom).trim() : '?';
const initials = e => e ? ((e.prenom[0]||'')+(e.nom[0]||'')).toUpperCase() : '?';
const refItem = t => t && t.ref ? byId(D.lib[t.ref.t]||[], t.ref.id) : null;
const taskTitle = t => { const it = refItem(t); return it ? it.titre : (t.titre||'Tâche'); };
const aidesOf = it => String((it&&it.aides)||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
const libTitle = (t,id) => { const it = byId(D.lib[t]||[], id); return it ? it.titre : '(supprimé)'; };

/* Classe d'origine : 6e A, 4eB, 5ème 2, 3°C, 4B, CM2… */
const CLS = '(?:[3-6]\\s?(?:e|è|ème|eme|°)\\s?[A-Za-z0-9]?|[3-6][A-Za-z]|CM[12]|CE[12])';
const CLS_END = new RegExp('(?:^|\\s)('+CLS+')\\s*$','i'), CLS_START = new RegExp('^('+CLS+')(?:\\s|$)','i');
function fmtOrigine(x){
  const t = String(x||'').replace(/\s+/g,'').replace(/(ème|eme|è|°)/i,'e');
  const m = t.match(/^([3-6])e?(.*)$/i); if (m) return m[1]+'e'+m[2].toUpperCase();
  return t.toUpperCase();
}
const niveauOf = e => { const o = (e&&e.origine)||''; const m = o.match(/^([3-6])e/); return m ? m[1]+'e' : o.replace(/[^A-Z0-9].*$/i,'').slice(0,3); };
function parseEleveLine(line){
  line = String(line);
  // Colonnes (tableur ou export entre guillemets) : la colonne qui commence par une classe donne la classe,
  // le reste de cette colonne est ignoré (ex. "ALBERT Arthur"	"5E5 Kathrine Switzer" → 5e5).
  let cols = null;
  if (line.includes('"')){ const q = [...line.matchAll(/"([^"]*)"/g)].map(m=>m[1].trim()).filter(Boolean); if (q.length>1) cols = q; }
  if (!cols && line.includes('\t')){ const q = line.split('\t').map(x=>x.replace(/"/g,'').trim()).filter(Boolean); if (q.length>1) cols = q; }
  if (cols){
    if (cols.every(c=>/^(nom|prenom|nom prenom|prenom nom|nom et prenom|classe|division|eleve|eleves|groupe)s?$/.test(norm(c)))) return null;
    let i = cols.findIndex(c=>CLS_START.test(c)), m;
    if (i>=0) m = cols[i].match(CLS_START); else { i = cols.findIndex(c=>CLS_END.test(c)); if (i>=0) m = cols[i].match(CLS_END); }
    if (m && cols.length>1){ const n = splitName(cols.filter((_,j)=>j!==i).join(' ')); if (n) return {...n, origine:fmtOrigine(m[1])}; }
  }
  let t = line.replace(/"/g,' ').replace(/[;,\t|]+/g,' ').replace(/\s+/g,' ').trim(); if (!t) return null;
  const n0 = norm(t); if (/\bnom\b/.test(n0) && /\bprenom\b/.test(n0)) return null; // ligne d'en-tête
  let origine = ''; let m = t.match(CLS_END);
  if (m){ origine = fmtOrigine(m[1]); t = t.slice(0, m.index).trim(); }
  else if ((m = t.match(CLS_START))){ origine = fmtOrigine(m[1]); t = t.slice(m[0].length).trim(); }
  const n = splitName(t); if (!n) return null;
  return {...n, origine};
}
function splitName(str){
  const w = String(str).trim().replace(/[;,\t]+/g,' ').split(/\s+/).filter(Boolean);
  if (!w.length) return null;
  const isUp = x => x.length>1 && x===x.toUpperCase() && /[A-ZÀ-Ý]/.test(x);
  const up = w.filter(isUp);
  if (up.length && up.length < w.length) return {prenom: w.filter(x=>!isUp(x)).join(' '), nom: up.join(' ')};
  return {prenom: w[0], nom: w.slice(1).join(' ')};
}

/* Historique des binômes */
function pairMap(cid, excludeId){
  const m = new Map();
  for (const s of seancesOf(cid)){ if (s.id===excludeId) continue;
    for (const q of s.equipes){ const ids = q.eleves;
      for (let i=0;i<ids.length;i++) for (let j=i+1;j<ids.length;j++){
        const k = [ids[i],ids[j]].sort().join('|'); if (!m.has(k)) m.set(k,[]); m.get(k).push({s,q}); } } }
  return m;
}
const pairKey = (a,b) => [a,b].sort().join('|');

/* Progression : statut automatique d'un élève pour une étape */
function autoProg(eid, etapeId){
  let st = 'non';
  for (const s of D.seances) for (const q of s.equipes){ if (!q.eleves.includes(eid)) continue;
    for (const t of q.taches){ const it = refItem(t); if (!it || it.etapeId!==etapeId) continue;
      if (t.statut==='reussi') return 'acquis'; if (t.statut!=='afaire') st = 'encours'; } }
  return st;
}
const progOf = (eid, etapeId) => (D.prog[eid]||{})[etapeId] || autoProg(eid, etapeId);

/* Tâches d'un élève (toutes séances) */
function tasksOfEleve(eid){
  const out = [];
  for (const s of D.seances.slice().sort(cmpDate)) for (const q of s.equipes) if (q.eleves.includes(eid)) for (const t of q.taches) out.push({s,q,t});
  return out;
}

/* ─────────────── Modales ─────────────── */
function modal(title, body, actions){
  const ov = h('div',{class:'ov'}); const close = () => ov.remove();
  ov.addEventListener('pointerdown', e => { if (e.target===ov) close(); });
  const box = h('div',{class:'modal'},
    h('div',{class:'mh'}, h('h3',null,title), h('button',{class:'x',title:'Fermer',onclick:close},'×')),
    h('div',{class:'mb'}, body),
    actions && actions.length ? h('div',{class:'mf'}, actions.map(a => h('button',{class:a.cls||'', onclick:()=>{ if (a.fn && a.fn()===false) return; close(); }}, a.l))) : null);
  ov.append(box); document.body.append(ov);
  const f = box.querySelector('.mb input,.mb textarea'); if (f) setTimeout(()=>f.focus(),30);
  return close;
}
function confirmBox(msg, fn, label){ modal('Confirmer', h('p',null,msg), [{l:'Annuler'},{l:label||'Supprimer',cls:'danger',fn}]); }

function field(fd, f){
  const [key,label,kind,extra] = fd; let inp;
  if (kind==='textarea') inp = h('textarea',{rows:3,value:f[key]||'',oninput:e=>f[key]=e.target.value});
  else if (kind==='number') inp = h('input',{type:'number',min:0,value:f[key]??'',oninput:e=>f[key]=e.target.value===''?'':+e.target.value});
  else if (kind==='stars'){ inp = h('div',{class:'stars'}); const draw=()=>setKids(inp, ...[1,2,3].map(n=>h('button',{type:'button',class:'star'+(n<=(f[key]||0)?' on':''),onclick:()=>{f[key]=f[key]===n?0:n;draw();}},'★'))); draw(); }
  else if (kind==='etape') inp = h('select',{value:f[key]||'',onchange:e=>f[key]=e.target.value}, h('option',{value:''},'—'), D.lib.etapes.map((s,i)=>h('option',{value:s.id},(i+1)+'. '+s.titre)));
  else if (kind==='photos'){ f[key] = [...(f[key]||[])]; inp = h('div',{class:'photos'});
    const draw = () => setKids(inp, ...f[key].map((src,i)=>h('span',{class:'phot'}, h('img',{src,onclick:()=>viewPhoto(src)}), h('button',{type:'button',class:'x del',title:'Retirer',onclick:()=>{f[key].splice(i,1);draw();}},'×'))),
      h('label',{class:'addph'},'📷 Ajouter', h('input',{type:'file',accept:'image/*',multiple:true,style:{display:'none'},onchange:async e=>{ for (const file of e.target.files){ try { f[key].push(await shrinkImage(file)); } catch(_){ toast('Image illisible'); } } draw(); }})));
    draw(); }
  else if (kind==='seq'){ f[key] = (f[key]||[]).map(r=>({...r})); inp = h('div',{class:'seq'});
    const L = f[key]; const mv = (i,j) => { if (j<0 || j>=L.length) return; [L[i],L[j]] = [L[j],L[i]]; draw(); };
    const draw = () => setKids(inp, 
      ...L.map((r,i) => { const it = byId(D.lib[r.t]||[], r.id);
        return h('div',{class:'seqrow'}, h('span',{class:'sn'},String(i+1)), h('span',{style:{flex:1}}, TYPES[r.t].icon+' '+(it?it.titre:'(supprimé)')+(it&&it.niveau?' '+'★'.repeat(it.niveau):'')),
          h('button',{type:'button',class:'x',title:'Monter',onclick:()=>mv(i,i-1)},'↑'), h('button',{type:'button',class:'x',title:'Descendre',onclick:()=>mv(i,i+1)},'↓'),
          h('button',{type:'button',class:'x del',title:'Retirer',onclick:()=>{ L.splice(i,1); draw(); }},'×')); }),
      h('select',{value:'',onchange:e=>{ const [t,id] = e.target.value.split(':'); if (id){ L.push({t,id}); draw(); } }},
        h('option',{value:''},'+ Ajouter un exercice ou un défi…'),
        h('optgroup',{label:'Exercices'}, D.lib.exercices.map(x=>h('option',{value:'exercices:'+x.id},x.titre))),
        h('optgroup',{label:'Défis'}, D.lib.defis.map(x=>h('option',{value:'defis:'+x.id},x.titre+(x.niveau?' '+'★'.repeat(x.niveau):''))))));
    draw(); }
  else if (kind==='blocs'){ f[key] = [...(f[key]||[])]; inp = h('div',{class:'blocsfld'});
    const draw = () => setKids(inp, ...f[key].map((id,i)=>h('span',{class:'phot'}, blocImg(id,0.5), h('button',{type:'button',class:'x del',title:'Retirer',onclick:()=>{f[key].splice(i,1);draw();}},'×'))),
      h('button',{type:'button',onclick:()=>blocsModal({pick:f[key], done:ids=>{f[key]=ids;draw();}})}, f[key].length ? '🧱 Modifier…' : '🧱 Choisir des blocs…'));
    draw(); }
  else if (kind==='multi'){ f[key] = [...(f[key]||[])];
    inp = h('div',{class:'multi'}, D.lib[extra].length ? D.lib[extra].map(it => { const b = h('button',{type:'button',class:'pick'+(f[key].includes(it.id)?' on':''),onclick:()=>{ const i=f[key].indexOf(it.id); if(i<0) f[key].push(it.id); else f[key].splice(i,1); b.classList.toggle('on'); }}, TYPES[extra].icon+' '+it.titre); return b; }) : h('span',{class:'muted'},'Rien dans « '+TYPES[extra].label+' » pour l\'instant.')); }
  else inp = h('input',{type:'text',value:f[key]||'',oninput:e=>f[key]=e.target.value});
  return h('div',{class:'fld'}, h('span',null,label), inp);
}
async function shrinkImage(file, max=1000){
  const url = URL.createObjectURL(file);
  try { const img = await new Promise((ok,ko)=>{ const i = new Image(); i.onload=()=>ok(i); i.onerror=ko; i.src=url; });
    const r = Math.min(1, max/Math.max(img.width, img.height)); const c = document.createElement('canvas');
    c.width = Math.round(img.width*r); c.height = Math.round(img.height*r); c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return c.toDataURL('image/jpeg', 0.72); } finally { URL.revokeObjectURL(url); }
}

function editItem(type, item){
  const isNew = !item; const f = item ? JSON.parse(JSON.stringify(item)) : {id:uid()};
  const body = h('div',null, TYPES[type].fields.map(fd => field(fd,f)));
  const acts = [];
  if (!isNew) acts.push({l:'🗑 Supprimer',cls:'danger l',fn:()=>{ confirmBox('Supprimer « '+(item.titre||'')+' » ?', ()=>commit(()=>deleteItem(type,item.id))); }});
  acts.push({l:'Annuler'},{l:isNew?'Ajouter':'Enregistrer',cls:'pri',fn:()=>{
    if (!String(f.titre||'').trim()){ toast('Un titre est nécessaire'); return false; }
    commit(()=>{ if (isNew) D.lib[type].push(f); else Object.assign(item, f); }); }});
  modal((isNew?'Nouveau : ':'Modifier : ')+TYPES[type].one, body, acts);
}
function deleteItem(type, id){
  D.lib[type] = D.lib[type].filter(x => x.id!==id);
  for (const arr of Object.values(D.lib)) for (const it of arr){
    for (const k of ['materiels','tapis','connaissances']) if (Array.isArray(it[k])) it[k] = it[k].filter(x=>x!==id);
    if (it.etapeId===id) it.etapeId = '';
    if (Array.isArray(it.items)) it.items = it.items.filter(r=>r.id!==id); }
  for (const s of D.seances) for (const q of s.equipes){ q.materiels = q.materiels.filter(x=>x!==id); q.tapis = q.tapis.filter(x=>x!==id); }
  for (const p of Object.values(D.prog)) delete p[id];
}

function findTask(s, id){
  let i = s.reserve.findIndex(t=>t.id===id); if (i>=0) return {list:s.reserve, i};
  for (const q of s.equipes){ i = q.taches.findIndex(t=>t.id===id); if (i>=0) return {list:q.taches, i, q}; }
  return null;
}
function doDrop(p, target, y, zoneEl){
  const idxIn = (list) => { if (y==null || !zoneEl) return list.length; let n=0; for (const el of zoneEl.querySelectorAll('.task')){ if (el.classList.contains('dragging')) continue; const r=el.getBoundingClientRect(); if (r.top+r.height/2 < y) n++; } return Math.min(n, list.length); };
  const s = byId(D.seances, U.seanceId); if (!s || !target) return;
  const q = target.startsWith('eq:') ? byId(s.equipes, target.slice(3)) : null;
  if (p.k==='eleve'){
    if (q && q.eleves.includes(p.id)) return;
    commit(()=>{ for (const x of s.equipes) x.eleves = x.eleves.filter(id=>id!==p.id); s.absents = s.absents.filter(id=>id!==p.id);
      if (q) q.eleves.push(p.id); else if (target==='absents') s.absents.push(p.id); });
  } else if (p.k==='tache'){
    const f = findTask(s, p.id); if (!f) return;
    if (target==='palette') return commit(()=>f.list.splice(f.i,1));
    if (target==='absents') return;
    const dest = q ? q.taches : s.reserve;
    commit(()=>{ const [t] = f.list.splice(f.i,1); dest.splice(idxIn(dest),0,t); });
  } else if (p.k==='lib'){
    if (TYPES[p.t].task){ if (target==='palette'||target==='absents') return; commit(()=>{ const l=q?q.taches:s.reserve; l.splice(idxIn(l),0,newTask({t:p.t,id:p.id})); }); }
    else if (q){ if (q[p.t].includes(p.id)) return; commit(()=>q[p.t].push(p.id)); }
    else toast('Déposez le matériel sur une équipe');
  } else if (p.k==='mat'){
    const from = byId(s.equipes, p.from); if (!from) return;
    if (q===from) return;
    commit(()=>{ from[p.t] = from[p.t].filter(x=>x!==p.id); if (q && !q[p.t].includes(p.id)) q[p.t].push(p.id); });
  }
}

/* Glisser-déposer à la souris, au doigt et au stylet (TNI, tablettes) */
let drag = null, dragJust = false;
document.addEventListener('pointerdown', e => {
  const c = e.target.closest('[data-drag]'); if (!c || e.button>0) return;
  if (e.target.closest('button,select,input,textarea')) return;
  drag = {el:c, x:e.clientX, y:e.clientY, started:false, p:JSON.parse(c.dataset.drag), id:e.pointerId};
});
document.addEventListener('pointermove', e => {
  if (!drag || e.pointerId!==drag.id) return;
  if (!drag.started){
    if (Math.hypot(e.clientX-drag.x, e.clientY-drag.y) < 6) return;
    drag.started = true; const r = drag.el.getBoundingClientRect();
    drag.dx = drag.x - r.left; drag.dy = drag.y - r.top;
    drag.g = drag.el.cloneNode(true); drag.g.classList.add('ghostdrag'); drag.g.style.width = r.width+'px';
    document.body.append(drag.g); drag.el.classList.add('dragging');
  }
  e.preventDefault();
  drag.g.style.left = (e.clientX-drag.dx)+'px'; drag.g.style.top = (e.clientY-drag.dy)+'px';
  const t = document.elementFromPoint(e.clientX, e.clientY); const z = t && t.closest('[data-drop]');
  if (z!==drag.hot){ if (drag.hot) drag.hot.classList.remove('hot'); drag.hot = z; if (z) z.classList.add('hot'); }
  autoScroll(e);
}, {passive:false});
function endDrag(e, cancel){
  if (!drag || e.pointerId!==drag.id) return;
  const d = drag; drag = null;
  if (!d.started) return;
  d.g.remove(); d.el.classList.remove('dragging'); if (d.hot) d.hot.classList.remove('hot');
  dragJust = true; setTimeout(()=>dragJust=false, 50);
  if (!cancel && d.hot) doDrop(d.p, d.hot.dataset.drop, e.clientY, d.hot);
}
document.addEventListener('pointerup', e => endDrag(e,false));
document.addEventListener('pointercancel', e => endDrag(e,true));
function autoScroll(e){
  const b = document.querySelector('.board'); if (!b) return; const r = b.getBoundingClientRect();
  if (e.clientX > r.right-50) b.scrollLeft += 14; else if (e.clientX < r.left+260 && e.clientX > r.left) b.scrollLeft -= 14;
  const mm = document.getElementById('main'), mr = mm.getBoundingClientRect();
  if (e.clientY > mr.bottom-40) mm.scrollTop += 14; else if (e.clientY < mr.top+30) mm.scrollTop -= 14;
}
document.addEventListener('keydown', e => {
  if (e.key==='Escape'){ const ov = [...document.querySelectorAll('.ov')].pop(); if (ov) ov.remove(); }
  if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z' && !e.target.closest('input,textarea')){ e.preventDefault(); undo(); }
});

function byGroup(s){ if (!s.groupes || !s.groupes.length) return s.equipes;

function makeTeams(s, size, all, niv){
  const pm = pairMap(s.classeId, s.id); const abs = new Set(s.absents);
  const nv = {}; for (const e of elevesOf(s.classeId)) nv[e.id] = niveauOf(e);
  const w = (a,b) => { const n = (pm.get(pairKey(a,b))||[]).length; let c = 3*n*n;
    if (niv && nv[a] && nv[b]) c += (niv==='mix') === (nv[a]===nv[b]) ? 2 : 0; return c; };
  const cost = team => { let c=0; for (let i=0;i<team.length;i++) for (let j=i+1;j<team.length;j++) c += w(team[i],team[j]); return c; };
  const shuffle = a => { for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
  if (all){
    const pool = elevesOf(s.classeId).filter(e=>!abs.has(e.id)).map(e=>e.id);
    const k = Math.max(1, Math.round(pool.length/size));
    let best=null, bc=Infinity;
    for (let tr=0; tr<200; tr++){
      const p = shuffle(pool.slice()); const teams = Array.from({length:k},()=>[]); p.forEach((id,i)=>teams[i%k].push(id));
      for (let it=0; it<300; it++){ // amélioration par échanges
        const a = Math.floor(Math.random()*k), b = Math.floor(Math.random()*k); if (a===b || !teams[a].length || !teams[b].length) continue;
        const i = Math.floor(Math.random()*teams[a].length), j = Math.floor(Math.random()*teams[b].length);
        const before = cost(teams[a])+cost(teams[b]); [teams[a][i],teams[b][j]] = [teams[b][j],teams[a][i]];
        if (cost(teams[a])+cost(teams[b]) > before) [teams[a][i],teams[b][j]] = [teams[b][j],teams[a][i]]; }
      const c = teams.reduce((x,t)=>x+cost(t),0); if (c<bc){ bc=c; best=teams; } if (bc===0) break; }
    while (s.equipes.length < k) s.equipes.push(newEq(s));
    s.equipes.forEach((q,i) => q.eleves = best[i] || []);
    s.equipes = s.equipes.filter((q,i) => i<k || q.taches.length || q.materiels.length || q.tapis.length || q.obs);
  } else {
    const placed = new Set(s.equipes.flatMap(q=>q.eleves));
    for (const id of shuffle(elevesOf(s.classeId).filter(e=>!abs.has(e.id)&&!placed.has(e.id)).map(e=>e.id))){
      let tgt=null, tc=Infinity;
      for (const q of s.equipes){ if (q.eleves.length>=size) continue; const c = q.eleves.reduce((x,o)=>x+w(id,o),0); if (c<tc){ tc=c; tgt=q; } }
      if (!tgt){ tgt = newEq(s); s.equipes.push(tgt); }
      tgt.eleves.push(id); }
  }
  toast('Équipes formées');
}

function findPC(o, d){ if (!o || typeof o!=='object' || d>5) return null;
  if (o.cl && typeof o.cl==='object' && !Array.isArray(o.cl)) return o;
  for (const v of Object.values(o)){ const r = findPC(v, d+1); if (r) return r; } return null; }
function pcClasses(S){
  const sd = S.studentData||{}; const out = [];
  for (const [k,c] of Object.entries(S.cl)){
    if (!c || !Array.isArray(c.students)) continue; const list = []; const seen = new Set();
    for (const st of c.students){
      if (st==null) continue;
      const id = typeof st==='string' ? st : (st.uid||st.id||null);
      const d = (id && sd[id]) || (typeof st==='object' ? st : {});
      let pr = d.prenoms ?? d.prenom ?? '', no = d.noms ?? d.nom ?? '';
      if (Array.isArray(pr)) pr = pr.join(' '); if (Array.isArray(no)) no = no.join(' ');
      if (!pr && !no && (d.name||st.name)){ const n = splitName(d.name||st.name); if (n){ pr=n.prenom; no=n.nom; } }
      pr = String(pr).trim(); no = String(no).trim(); if (!pr && !no) continue;
      const key = id || norm(pr+' '+no); if (seen.has(key)) continue; seen.add(key);
      list.push({pcUid:id, prenom:pr||no, nom:pr?no:''});
    }
    if (list.length) out.push({code:k, nom:(c.nomComplet||k), eleves:list});
  }
  return out.sort((a,b)=>a.nom.localeCompare(b.nom,'fr'));
}

      const orig = fmtOrigine(c.nom).length<=5 ? fmtOrigine(c.nom) : c.nom;

        D.eleves.push({id:uid(), prenom:e.prenom, nom:e.nom, origine:orig, classeId:cl.id, pcUid:e.pcUid, remarque:''}); nE++; }
      U.classeId = cl.id; } });
    toast(nC+' classe(s) créée(s), '+nE+' élève(s) ajouté(s)'); }}]);

function genCode(){ const a='ABCDEFGHJKMNPQRSTUVWXYZ23456789'; return Array.from(crypto.getRandomValues(new Uint8Array(6)),x=>a[x%a.length]).join(''); }

async function pubChunks(code, k, str){
  const v = Date.now().toString(36)+Math.random().toString(36).slice(2,5), N = 1400, n = Math.max(1, Math.ceil(str.length/N));
  for (let i=0;i<n;i++) await ntfyPub(code, {k, v, i, n, d:str.slice(i*N,(i+1)*N)});
}
function makeAssembler(onDone){ const parts = {};
  return p => { const key = p.k+'|'+p.v; const e = parts[key] = parts[key] || {n:p.n, got:[]}; e.got[p.i] = p.d;
    if (e.got.filter(x=>x!=null).length === e.n){ delete parts[key]; try { onDone(p.k, JSON.parse(e.got.join(''))); } catch(_){} } }; }
const LIVE = {es:null, code:null, ok:false, sent:{}, t:null, pending:false};
const liveSeance = () => D.seances.find(x => x.live && x.live.on);
function liveBadge(){ return h('span',{class:'livebadge',id:'livebadge'}, h('span',{class:'dot'+(LIVE.ok?' ok':'')}), LIVE.ok ? 'En direct' : 'Connexion…'); }
function refreshBadge(){ const b = document.getElementById('livebadge'); if (b) b.replaceWith(liveBadge()); }
function liveTick(){
  const s = liveSeance();
  if (!s){ if (LIVE.es){ LIVE.es.close(); LIVE.es=null; } LIVE.code=null; LIVE.sent={}; LIVE.ok=false; return; }
  if (LIVE.code !== s.live.code){
    if (LIVE.es) LIVE.es.close();
    LIVE.code = s.live.code; LIVE.sent = {}; LIVE.ok = false;
    try { const es = new EventSource(NTFY+topicOf(LIVE.code)+'/sse?since=all'); LIVE.es = es;
      es.onopen = () => { LIVE.ok = true; refreshBadge(); };
      es.onerror = () => { LIVE.ok = false; refreshBadge(); };
      es.onmessage = e => { let m, p; try { m = JSON.parse(e.data); p = JSON.parse(m.message); } catch(_){ return; } if (p && p.k==='ev') applyEv(m.id, p); };
    } catch(e){ LIVE.ok = false; }
  }
  clearTimeout(LIVE.t); LIVE.t = setTimeout(publishSnap, 900);
}
function snapOf(s){
  const lib = {};
  const st = {bd:D.blocDesc||{}, t:s.titre||'', d:s.date, q:s.equipes.map(q => ({i:q.id, n:q.nom, e:q.eleves.length, t:q.taches.map(t => {
    const it = refItem(t); if (it) lib[it.id] = {t:it.titre, y:t.ref.t, n:it.niveau||0, c:it.description||'', a:aidesOf(it),
      m:[...(it.materiels||[]).map(id=>libTitle('materiels',id)), ...(it.tapis||[]).map(id=>libTitle('tapis',id))], b:it.blocs||[]};
    return {i:t.id, r:it?it.id:null, x:it?null:taskTitle(t), s:t.statut, h:t.hints||0}; })}))};
  return {st, lib};
}
async function publishSnap(){
  const s = liveSeance(); if (!s || !LIVE.code) return; const code = LIVE.code;
  if (s.equipes.some(q=>!q.code)) commit(()=>s.equipes.forEach(q=>{ if (!q.code) q.code = newTeamCode(); }), true);
  const {st, lib} = snapOf(s); const C = (D.carnet=D.carnet||{})[s.classeId] || {};
  for (const q of st.q){ const eq = byId(s.equipes, q.i); q.k = await sha16('robotique-equipe:'+q.i+':'+eq.code); if (C[eq.nom]) q.c = C[eq.nom].b; }
  for (const [k, obj] of [['lib',lib],['st',st]]){ const str = JSON.stringify(obj); if (LIVE.sent[k]===str) continue;
    try { await pubChunks(code, k, str); LIVE.sent[k] = str; } catch(e){ LIVE.ok = false; refreshBadge(); } }
}
function applyEv(mid, p){
  const s = liveSeance(); if (!s) return; s.live.seen = s.live.seen || [];
  if (s.live.seen.includes(mid)) return; s.live.seen.push(mid); if (s.live.seen.length>800) s.live.seen.splice(0,200);
  const q = byId(s.equipes, p.team), t = q && q.taches.find(x => x.id===p.task);
  if (p.a==='carnet' && q && typeof p.b==='string'){ const C = (D.carnet=D.carnet||{})[s.classeId] = (D.carnet=D.carnet||{})[s.classeId] || {}; const old = (C[q.nom]||{}).b || '';
    const nb = cnMerge(old, p.b); if (nb!==old){ C[q.nom] = {b:nb, t:Date.now()}; const gain = [...nb].reduce((a,c)=>a+RA.indexOf(c)%16,0) - [...old].reduce((a,c)=>a+RA.indexOf(c)%16,0);
      if (gain>0) toast('📒 '+q.nom+' : '+gain+' activité(s) du carnet réussie(s)'); save(); softRender(); } return; }
  if (t){
    if (p.a==='done' && t.statut!=='reussi' && t.statut!=='avalider'){ t.statut = 'avalider'; toast('🎉 '+q.nom+' : « '+taskTitle(t)+' » à valider'); }
    else if (p.a==='hint') t.hints = Math.max(t.hints||0, p.n|0);
  }
  save(); softRender();
}

setInterval(() => { if (LIVE.pending && !document.querySelector('.ov') && !(document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))){ LIVE.pending = false; render(); } }, 1000);

const DBX = {key:'kelrt6zi21z7zcz', path:'/robotique.json', auth:'https://www.dropbox.com/oauth2/authorize', token:'https://api.dropboxapi.com/oauth2/token', content:'https://content.dropboxapi.com/2', t:null, busy:false, state:'', err:''};
const DKEY = 'robotique-dbx';
let DB = {}; try { DB = JSON.parse(localStorage.getItem(DKEY)||'{}'); } catch(_){}
const dbSave = () => { try { localStorage.setItem(DKEY, JSON.stringify(DB)); } catch(_){} };
const dbxKey = () => DB.key || DBX.key;
const redirectUri = () => location.origin + location.pathname;
const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const hasData = () => D.classes.length || D.eleves.length || D.seances.length || Object.values(D.lib).some(a=>a.length);
async function dbxConnect(){
  const v = b64url(crypto.getRandomValues(new Uint8Array(48))); sessionStorage.setItem('robotique-dbx-v', v);
  const ch = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(v)));
  location.href = DBX.auth+'?client_id='+encodeURIComponent(dbxKey())+'&response_type=code&redirect_uri='+encodeURIComponent(redirectUri())+'&code_challenge='+ch+'&code_challenge_method=S256&token_access_type=offline';
}
async function dbxHandleRedirect(){
  const q = new URLSearchParams(location.search); const code = q.get('code'), v = sessionStorage.getItem('robotique-dbx-v');
  if (!code && !q.get('error')) return false;
  history.replaceState(null,'',location.pathname+location.hash);
  if (!code || !v) { toast('Connexion Dropbox annulée'); return true; }
  try { const r = await fetch(DBX.token, {method:'POST', body:new URLSearchParams({code, grant_type:'authorization_code', client_id:dbxKey(), redirect_uri:redirectUri(), code_verifier:v})});
    const j = await r.json(); if (!r.ok) throw new Error(j.error_description || ('HTTP '+r.status));
    DB = {key:DB.key, refresh:j.refresh_token, access:j.access_token, exp:Date.now()+((j.expires_in||14400)-60)*1000}; dbSave(); sessionStorage.removeItem('robotique-dbx-v');
    toast('Dropbox connecté'); } catch(e){ DBX.state='err'; DBX.err = e.message; toast('Échec de la connexion Dropbox : '+e.message); }
  return true;
}
async function dbxToken(){
  if (DB.access && Date.now() < DB.exp) return DB.access;
  const r = await fetch(DBX.token, {method:'POST', body:new URLSearchParams({grant_type:'refresh_token', refresh_token:DB.refresh, client_id:dbxKey()})});
  const j = await r.json(); if (!r.ok) throw new Error('autorisation expirée : reconnectez Dropbox');
  DB.access = j.access_token; DB.exp = Date.now()+((j.expires_in||14400)-60)*1000; dbSave(); return DB.access;
}
async function dbxDownload(){
  const r = await fetch(DBX.content+'/files/download', {method:'POST', headers:{Authorization:'Bearer '+await dbxToken(), 'Dropbox-API-Arg':JSON.stringify({path:DBX.path})}});
  if (r.status===409) return null; if (!r.ok) throw new Error('lecture HTTP '+r.status);
  return {meta:JSON.parse(r.headers.get('Dropbox-API-Result')||'{}'), data:JSON.parse(await r.text())};
}
async function dbxUpload(){
  const mode = DB.rev ? {'.tag':'update', update:DB.rev} : {'.tag':'overwrite'};
  const r = await fetch(DBX.content+'/files/upload', {method:'POST', headers:{Authorization:'Bearer '+await dbxToken(), 'Content-Type':'application/octet-stream',
    'Dropbox-API-Arg':JSON.stringify({path:DBX.path, mode, autorename:false, mute:true})}, body:JSON.stringify(D)});
  if (r.status===409) return 'conflict'; if (!r.ok) throw new Error('envoi HTTP '+r.status);
  const j = await r.json(); DB.rev = j.rev; DB.syncedMod = D._mod||0; DB.last = Date.now(); dbSave(); return 'ok';
}
function dbxAdopt(rem){
  D = normalize(rem.data); if (localStorage.getItem(RESET_KEY)){ delete D.profLock; localStorage.removeItem(RESET_KEY); setTimeout(()=>toast('Mot de passe prof supprimé : définissez-en un nouveau dans ⚙ Paramètres'),300); }
  DB.rev = rem.meta.rev; DB.syncedMod = D._mod||0; DB.last = Date.now(); dbSave();
  try { localStorage.setItem(KEY, JSON.stringify(D)); } catch(_){} liveTick(); render();
}
async function dbxSync(){
  if (!DB.refresh || DBX.busy) return; DBX.busy = true; DBX.state = 'sync'; refreshDbx();
  try {
    const rem = await dbxDownload();
    const localChanged = (D._mod||0) > (DB.syncedMod||0);
    if (!rem){ await dbxUpload(); }
    else if (rem.meta.rev === DB.rev){ if (localChanged && await dbxUpload()==='conflict'){ DB.rev = null; DBX.busy = false; return dbxSync(); } }
    else if (!hasData() || (DB.rev && !localChanged)) dbxAdopt(rem);
    else { DBX.busy = false; DBX.state = ''; refreshDbx(); return dbxChoose(rem); }
    DBX.state = 'ok'; DBX.err = '';
  } catch(e){ DBX.state = 'err'; DBX.err = e.message; }
  DBX.busy = false; refreshDbx();
}
function dbxChoose(rem){
  const when = rem.meta.server_modified ? new Date(rem.meta.server_modified).toLocaleString('fr-FR') : '?';
  modal('Deux versions différentes', h('div',null,
    h('p',null,'Les données de Dropbox (enregistrées le '+when+') et celles de cet ordinateur ont été modifiées séparément. Laquelle garder ?'),
    h('p',{class:'muted',style:{fontSize:'12px'}},'Conseil : exportez d\'abord une sauvegarde (onglet Données) si vous avez un doute.')),
    [{l:'Garder cet ordinateur',fn:()=>{ DB.rev = rem.meta.rev; dbSave(); D._mod = Date.now(); dbxSync(); }},
     {l:'Garder Dropbox',cls:'pri',fn:()=>{ undoStack.push(JSON.stringify(D)); dbxAdopt(rem); DBX.state='ok'; refreshDbx(); }}]);
}

const UNLOCK_KEY = 'robotique-unlocked', RESET_KEY = 'robotique-reset';

const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
async function hashPw(pw, salt, iter){
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({name:'PBKDF2', salt:Uint8Array.from(atob(salt), c=>c.charCodeAt(0)), iterations:iter, hash:'SHA-256'}, key, 256);
  return b64(bits);
}
async function makeLock(pw){ const salt = b64(crypto.getRandomValues(new Uint8Array(16))), iter = 150000; return {salt, iter, hash: await hashPw(pw, salt, iter)}; }
async function checkPw(pw){ if (!D.profLock) return true; const L = D.profLock; return (await hashPw(pw, L.salt, L.iter||150000)) === L.hash; }
function pwField(ph, onEnter){ return h('input',{type:'password',autocomplete:'current-password',placeholder:ph,onkeydown:e=>{ if (e.key==='Enter' && onEnter) onEnter(); }}); }

  setKids(document.getElementById('main'), h('div',{class:'empty card',style:{maxWidth:'420px'}},

function askProf(fn){
  if (!D.profLock) return askPin(fn);
  const inp = pwField('Mot de passe prof', ()=>box.querySelector('.mf .pri').click());
  const close = modal('Mot de passe prof', h('div',{class:'fld'}, h('span',null,'Réservé au professeur'), inp),
    [{l:'Annuler'},{l:'OK',cls:'pri',fn:()=>{ checkPw(inp.value).then(ok=>{ if (ok){ close(); fn(); } else { toast('Mot de passe incorrect'); inp.value=''; inp.focus(); } }); return false; }}]);

function lockSection(){
  const wrap = h('div',{style:{marginTop:'14px'}});
  const draw = () => {
    if (!D.profLock){
      const a = pwField('Nouveau mot de passe'), b = pwField('Confirmer');
      a.autocomplete = b.autocomplete = 'new-password';
      setKids(wrap, h('div',{class:'sub'},'Accès prof'),
        h('p',{style:{fontSize:'13px',margin:'4px 0'}},'⚠ Aucun mot de passe : n\'importe qui peut ouvrir l\'espace prof sur cet ordinateur.'),
        h('div',{class:'row'}, a, b, h('button',{class:'pri',onclick:async()=>{
          if (a.value.length<4) return toast('4 caractères minimum'); if (a.value!==b.value) return toast('Les deux saisies diffèrent');
          const L = await makeLock(a.value); sessionStorage.setItem(UNLOCK_KEY,'1'); commit(()=>{ D.profLock = L; if (D.lockDelay==null) D.lockDelay = 20; }, true); toast('Espace prof protégé'); draw(); }},'🔒 Protéger')));
    } else {
      setKids(wrap, h('div',{class:'sub'},'Accès prof'),
        h('p',{style:{fontSize:'13px',margin:'4px 0'}},'🔒 Protégé par mot de passe. Il est demandé à l\'ouverture de l\'espace prof et pour quitter le mode élève.'),
        h('div',{class:'row'}, h('span',{style:{fontSize:'13px'}},'Verrouillage automatique après'),
          h('select',{value:String(D.lockDelay||0),onchange:e=>commit(()=>D.lockDelay=+e.target.value,true)}, [[0,'jamais'],[5,'5 min'],[10,'10 min'],[20,'20 min'],[45,'45 min']].map(([v,l])=>h('option',{value:String(v)},l))),
          h('span',{class:'muted',style:{fontSize:'12px'}},'d\'inactivité (sauf en mode élève)')),
        h('div',{class:'row'},
          h('button',{onclick:()=>{ const o = pwField('Mot de passe actuel'), a = pwField('Nouveau'), b = pwField('Confirmer');
            modal('Changer le mot de passe', h('div',{style:{display:'flex',flexDirection:'column',gap:'8px'}}, o, a, b), [{l:'Annuler'},{l:'Changer',cls:'pri',fn:()=>{
              (async()=>{ if (!await checkPw(o.value)) return toast('Mot de passe actuel incorrect'); if (a.value.length<4) return toast('4 caractères minimum'); if (a.value!==b.value) return toast('Les deux saisies diffèrent');
                const L = await makeLock(a.value); commit(()=>D.profLock = L, true); toast('Mot de passe changé'); o.closest('.ov').remove(); })(); return false; }}]); }},'Changer le mot de passe'),
          h('button',{class:'danger',onclick:()=>{ const o = pwField('Mot de passe actuel');
            modal('Supprimer la protection', h('div',null, h('p',null,'L\'espace prof ne sera plus protégé.'), o), [{l:'Annuler'},{l:'Supprimer',cls:'danger',fn:()=>{
              checkPw(o.value).then(ok=>{ if (!ok) return toast('Mot de passe incorrect'); commit(()=>delete D.profLock, true); o.closest('.ov').remove(); draw(); toast('Protection supprimée'); }); return false; }}]); }},'Supprimer la protection')),
        h('p',{class:'muted',style:{fontSize:'12px'}},'Avec Dropbox, le mot de passe suit vos données sur tous vos ordinateurs. Les élèves n\'en ont pas besoin : leur page d\'équipe reste libre.'));
    }
  };
  draw(); return wrap;
}

const STU_KEY = 'robotique-poste-eleve';
// Un poste sans données prof ouvert en mode élève devient « poste élève » : le mode prof y demande le code prof.
function markStudentPost(){ if (!hasData() && !D.profLock) try { localStorage.setItem(STU_KEY,'1'); } catch(_){} }
function stuGate(){
  document.body.classList.remove('stu');
  const inp = pwField('Code prof', ()=>go()); const msg = h('p',{class:'muted',style:{minHeight:'20px'}});
  const go = async () => { const v = inp.value.trim(); if (!v) return;
    if (await sha16('robotique-carnet:MAITRE:'+v.toUpperCase().replace(/[^A-Z0-9]/g,''))===CARNET.maitre){ localStorage.removeItem(STU_KEY); startProf(); }
    else { inp.value=''; inp.focus(); msg.textContent = 'Code incorrect.'; } };
  const eleve = () => { localStorage.removeItem(ROLE_KEY); history.replaceState(null,'',location.pathname+'#eleve'); studentApp(); };
  setKids(document.getElementById('hd'), h('h1',null,'🤖 Robotique'), h('span',{class:'sp',style:{flex:1}}), h('span',{class:'ver'},APP_VERSION));
  setKids(document.getElementById('main'), h('div',{class:'empty card',style:{maxWidth:'440px'}},
    h('div',{style:{fontSize:'44px'}},'🎒'), h('h2',null,'Ordinateur élève'),
    h('p',{class:'muted'},'Cet ordinateur a été ouvert en mode élève. Le mode prof y est réservé au professeur.'),
    h('div',{class:'row',style:{justifyContent:'center'}}, inp, h('button',{class:'pri',onclick:go},'Mode prof')), msg,
    h('p',null, h('button',{class:'big',onclick:eleve},'🎒 Retour au mode élève'))));
  setTimeout(()=>inp.focus(), 30);
}
function startProf(){ if (localStorage.getItem(STU_KEY)==='1' && !hasData()) return stuGate(); document.body.classList.remove('stu'); if (isLocked()) return lockScreen(); if (U.mode==='projo' && !byId(D.seances,U.seanceId)) U.mode=''; render(); liveTick(); dbxSync(); }

const RA = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';
// Progression compacte du carnet : par composant, nombre d'activités réussies dans l'ordre (+16 si ouvert par code prof)
function cnPack(P){ return CARNET.mondes.map(mo => { let n = 0; while (n < mo.defis.length && P.done[mo.defis[n].id]) n++; return RA[n + ((P.open||{})[mo.id] ? 16 : 0)]; }).join(''); }
function cnMerge(a, b){ return CARNET.mondes.map((mo,i) => { const x = Math.max(0, RA.indexOf((a||'')[i]||'0')), y = Math.max(0, RA.indexOf((b||'')[i]||'0'));
  return RA[Math.max(x%16, y%16) + ((x>=16 || y>=16) ? 16 : 0)]; }).join(''); }
function cnUnpack(body, P){ P = P || {done:{}, open:{}}; P.done = P.done||{}; P.open = P.open||{};
  CARNET.mondes.forEach((mo,mi) => { const v = RA.indexOf((body||'')[mi]); if (v<0) return; if (v>=16) P.open[mo.id] = 1; mo.defis.slice(0, v%16).forEach(d => { if (!P.done[d.id]) P.done[d.id] = Date.now(); }); });
  return P; }
const TEAMCODE = 'ABCDEFGHJKMNPQRSTUVWXYZ';
const newTeamCode = () => Array.from(crypto.getRandomValues(new Uint8Array(4)), x => TEAMCODE[x % TEAMCODE.length]).join('');
async function sha16(t){ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('').slice(0,16); }

function mergeLib(lib){
  const map = {}, added = [];
  let filled = 0;
  for (const k of Object.keys(lib)) for (const it of lib[k]){ const f = D.lib[k].find(x=>norm(x.titre)===norm(it.titre)); if (f){ map[it.id] = f.id; if (it.blocs && it.blocs.length && !(f.blocs&&f.blocs.length)){ f.blocs = it.blocs; filled++; } } else { D.lib[k].push(it); added.push(it); } }
  const r = x => map[x] || x;
  for (const it of added){ for (const k of ['materiels','tapis','connaissances']) if (Array.isArray(it[k])) it[k] = it[k].map(r); if (it.etapeId) it.etapeId = r(it.etapeId);
    if (Array.isArray(it.items)) it.items = it.items.map(x=>({...x, id:r(x.id)})); }
  if (filled) setTimeout(()=>toast(filled+' exercice(s) existant(s) complété(s) avec leurs blocs'), 1200);
  return {map, added:added.length};
}

function loadExample(){
  commit(()=>{
    const {lib, id} = exampleData(); const {map} = mergeLib(lib);
    const ok = k => id[k] ? (map[id[k]] || id[k]) : null;
    const c = {id:uid(), nom:'Club robotique (exemple)'}; D.classes.push(c);
    const names = ['Alix Martin','Bilal Durand','Chloé Petit','Dylan Moreau','Emma Leroy','Farid Roux','Gabin Fournier','Hana Girard','Inès Bonnet','Jules Mercier','Kenza Lambert','Léo Fontaine'];
    const els = names.map(n => { const [p,...r] = n.split(' '); const e = {id:uid(),prenom:p,nom:r.join(' '),classeId:c.id,remarque:''}; D.eleves.push(e); return e.id; });
    const d1 = new Date(); d1.setDate(d1.getDate()-14); const d2 = new Date(); d2.setDate(d2.getDate()-7);
    const iso = d => d.toISOString().slice(0,10);
    const T = (k, st) => ok(k) ? {id:uid(), ref:{t:k[0]==='d'?'defis':'exercices', id:ok(k)}, titre:'', statut:st, note:''} : null;
    const eq = (n, ids, ts, mats, tap) => ({id:uid(), nom:n, eleves:ids, taches:ts.filter(Boolean), materiels:mats.map(ok).filter(Boolean), tapis:tap.map(ok).filter(Boolean), obs:''});
    D.seances.push({id:uid(), classeId:c.id, date:iso(d1), titre:'Découverte', notes:'', reserve:[], absents:[],
      equipes:[eq('Équipe 1',els.slice(0,3),[T('x1','reussi'),T('d1','reussi')],['m1'],['t1']), eq('Équipe 2',els.slice(3,6),[T('x1','reussi'),T('d1','encours')],['m2'],['t1']),
               eq('Équipe 3',els.slice(6,9),[T('x1','reussi')],['m1'],[]), eq('Équipe 4',els.slice(9,12),[T('x1','encours')],['m1'],[])]});
    const s2 = {id:uid(), classeId:c.id, date:iso(d2), titre:'Boucles', notes:'', reserve:[T('d3','afaire')].filter(Boolean), absents:[els[11]],
      equipes:[eq('Équipe 1',[els[0],els[3],els[6]],[T('d2','reussi')],['m1','m5'],[]), eq('Équipe 2',[els[1],els[4],els[9]],[T('d2','encours'),T('x3','reussi')],['m1'],[]),
               eq('Équipe 3',[els[2],els[7],els[10]],[T('d2','reprendre')],['m1'],[]), eq('Équipe 4',[els[5],els[8]],[T('x2','reussi'),T('d1','reussi')],['m2'],['t1'])]};
    s2.equipes[1].obs = 'Bonne entraide, à valoriser.';
    D.seances.push(s2); U.classeId = c.id; U.seanceId = s2.id; U.view = 'seance';
  });
  toast('Exemple chargé');
}

(async () => {
  if (await dbxHandleRedirect()) return startProf();
  if (location.hash==='#carnet') return carnetApp();
  if (/^#(code=|eleve)/.test(location.hash)) return studentApp();
  if (location.hash==='#prof') return startProf();
  const role = localStorage.getItem(ROLE_KEY);
  if (role==='prof') return startProf();
  if (role==='eleve') return studentApp();
  splash();
})();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
